services:
  postgres:
    image: postgres:16-alpine
    container_name: gallery_postgres
    restart: always
    environment:
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: gallery_password
      POSTGRES_DB: gallery_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery -d gallery_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gallery_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://gallery:gallery_password@postgres:5432/gallery_db?sslmode=disable"
      STORAGE_PATH: "/app/storage"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - gallery_storage:/app/storage

  prometheus:
    image: prom/prometheus:latest
    container_name: gallery_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app

volumes:
  postgres_data:
  gallery_storage:
